services:
  memento:
    image: ghcr.io/rcarmo/memento:${MEMENTO_VERSION:?set MEMENTO_VERSION to a release such as 1.0.0}
    container_name: memento
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    init: true
    command:
      - --env-file
      - /run/secrets/memento.env
      - --config
      - /etc/memento/config.json
      - serve
      - --http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --endpoint
      - /mcp
    environment:
      RAYON_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "18081:8000"
    volumes:
      - /volume1/docker/memento/config/config.json:/etc/memento/config.json:ro
      - /volume1/docker/memento/config/memento.env:/run/secrets/memento.env:ro
      - /volume1/docker/memento/state:/var/lib/memento
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/memento-go
        - healthcheck
        - --address
        - 127.0.0.1:8000
        - --timeout
        - 2s
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
