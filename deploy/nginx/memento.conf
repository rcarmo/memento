server {
    listen 443 ssl http2;
    server_name memento.example.com;

    ssl_certificate /etc/letsencrypt/live/memento/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memento/privkey.pem;

    client_max_body_size 72m;

    # Proxy MCP plus the optional graph, admin and asset-staging routes. The
    # service enforces authentication independently on every protected route.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # The container healthcheck uses the native TCP probe. External liveness
    # should call authenticated memory_status rather than a synthetic proxy 200.
}
