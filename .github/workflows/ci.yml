name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_MODEL_PATHS: models/gte/gte-small.gtemodel models/needle/memento-router.ndl models/needle/needle.model

jobs:
  go-quality:
    name: Pure-Go quality and allocation gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.sum
            umcp/go.sum
      - run: make audit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.1'
      - name: Install pinned browser audit dependencies
        run: make ui-setup UI_INSTALL_FLAGS=--with-deps
      - name: Repeat graph and admin UI audit against isolated Go runtimes
        run: make ui-test UI_REPEAT=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ui-audit-results
          path: build/ui-audit
          retention-days: 7

  runtime-models:
    name: Prepare cached runtime models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
      - name: Build cache key from runtime model manifest
        id: manifest
        shell: bash
        run: |
          key="runtime-models-${RUNNER_OS}-$(python tools/prepare_runtime_models.py --key-only)"
          echo "cache-key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/gte/gte-small.gtemodel
            models/needle/memento-router.ndl
            models/needle/needle.model
          key: ${{ steps.manifest.outputs.cache-key }}
      - name: Prepare verified runtime models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/prepare_runtime_models.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-models
          path: |
            models/gte/gte-small.gtemodel
            models/needle/memento-router.ndl
            models/needle/needle.model
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  model-and-container:
    name: Real models and replacement container
    needs: runtime-models
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-models
          path: models
      - name: Model parity and allocation budgets
        run: |
          make model-test
          make performance
      - name: Exact Needle corpus parity
        if: matrix.arch == 'arm64'
        timeout-minutes: 85
        run: make corpus-test
      - name: Build and test pure-Go image
        if: matrix.arch == 'amd64'
        run: make go-container-contract MEMENTO_VERSION=1.0.5
