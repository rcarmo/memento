name: Go port parity

on:
  push:
    branches: [go]
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go-port.yml'

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python/uMCP compatibility ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install pinned uMCP and Python test dependencies
        run: make install-dev
      - name: Validate Python service against this stdlib
        run: |
          make lint format-check typecheck test graph-check
          .venv/bin/python - <<'PY'
          import platform
          import aioumcp
          import umcp
          import umcp_shared

          print(platform.python_version(), aioumcp.__file__, umcp.__file__, umcp_shared.__file__)
          PY

  upstream-umcp:
    name: Pinned upstream uMCP suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned uMCP reference
        uses: actions/checkout@v4
        with:
          repository: rcarmo/umcp
          ref: 30cce7dfe08c6ee63de235f7d81754ba286dafbb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install upstream test tools
        run: python -m pip install 'pytest<10' pytest-asyncio coverage ruff
      - name: Lint runtime modules
        run: ruff check umcp.py aioumcp.py umcp_shared.py
      - name: Run the complete upstream suite with branch coverage
        run: |
          python -m coverage run --source=umcp,aioumcp -m pytest tests/ -q
          python -m coverage report

  scalar-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - run: make -C go check
      - run: make -C go race
      - run: make -C go fuzz
      - run: make -C go cross
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            models/gte/gte-small.gtemodel
            models/needle/memento-router.ndl
            models/needle/needle.model
          key: go-reference-models-${{ hashFiles('models/runtime-models.json') }}
      - name: Verify/fetch pinned public reference models (test-only Python)
        run: python tools/prepare_runtime_models.py --root .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make -C go model-test GTE_MODEL_PATH="${{ github.workspace }}/models/gte/gte-small.gtemodel" NEEDLE_MODEL_PATH="${{ github.workspace }}/models/needle/memento-router.ndl" NEEDLE_TOKENIZER_PATH="${{ github.workspace }}/models/needle/needle.model"
      - name: Exact 360-case Needle corpus parity (scalar)
        timeout-minutes: 85
        run: make -C go corpus-test NEEDLE_MODEL_PATH="${{ github.workspace }}/models/needle/memento-router.ndl" NEEDLE_TOKENIZER_PATH="${{ github.workspace }}/models/needle/needle.model"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.os }}
          path: build/go/coverage.out
