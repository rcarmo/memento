name: Go port parity

on:
  push:
    branches: [go]
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go-port.yml'

permissions:
  contents: read

jobs:
  scalar-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - run: make -C go check
      - run: make -C go race
      - run: make -C go fuzz
      - run: make -C go cross
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.os }}
          path: build/go/coverage.out
