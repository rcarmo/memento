name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  RUNTIME_MODEL_PATHS: models/gte/gte-small.gtemodel models/needle/memento-router.ndl models/needle/needle.model

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate semantic version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3 or v1.2.3-rc.1; got: $tag" >&2
            exit 1
          fi
          if [[ "${tag#v}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Validate pure-Go runtime
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go/go.sum
            go/umcp/go.sum
      - name: Run release quality gates
        run: |
          make -C go audit
          make -C go release-check VERSION="${GITHUB_REF_NAME#v}" SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          git diff --exit-code

  runtime-models:
    name: Prepare cached runtime models
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
      - name: Build cache key from runtime model manifest
        id: manifest
        shell: bash
        run: |
          key="runtime-models-${RUNNER_OS}-$(python tools/prepare_runtime_models.py --key-only)"
          echo "cache-key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore runtime model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            models/gte/gte-small.gtemodel
            models/needle/memento-router.ndl
            models/needle/needle.model
          key: ${{ steps.manifest.outputs.cache-key }}
      - name: Prepare verified runtime models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/prepare_runtime_models.py
      - name: Upload runtime models once
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-models
          path: |
            models/gte/gte-small.gtemodel
            models/needle/memento-router.ndl
            models/needle/needle.model
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build ${{ matrix.platform }} image
    needs: [validate-tag, quality, runtime-models]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1

      - name: Download prepared runtime models
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-runtime-models
          path: models

      - name: Verify release model artefacts
        shell: bash
        run: |
          for path in $RUNTIME_MODEL_PATHS; do
            test -s "$path"
          done
          python tools/prepare_runtime_models.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        id: build-meta
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.1
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-meta.outputs.date }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  compatibility-amd64:
    name: Test amd64 image without AVX
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: go/go.sum

      - name: Download amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-amd64
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QEMU user emulator
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Export image filesystem
        shell: bash
        run: |
          digest="$(basename /tmp/digests/*)"
          image="${IMAGE_NAME}@sha256:${digest}"
          docker pull "$image"
          container="$(docker create "$image")"
          mkdir -p /tmp/rootfs
          docker export "$container" | sudo tar -C /tmp/rootfs -xf -
          docker rm "$container"
          sudo cp /usr/bin/qemu-x86_64-static /tmp/rootfs/usr/bin/

      - name: Run Go SSE2 SIMD smoke under Westmere CPU
        shell: bash
        run: |
          (cd go && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -o /tmp/memento-simd-check ./cmd/memento-simd-check)
          simd="$(/usr/bin/qemu-x86_64-static -cpu Westmere /tmp/memento-simd-check)"
          echo "$simd"
          grep -q '^arch=amd64 backend=sse2 sse2=true avx2_fma=false ' <<< "$simd"

      - name: Run pure-Go service/model smoke under Westmere CPU
        shell: bash
        run: |
          sudo mkdir -p /tmp/rootfs/etc/memento /tmp/rootfs/var/lib/memento
          sudo cp deploy/diskstation.config.example.json /tmp/rootfs/etc/memento/config.json
          sudo chroot /tmp/rootfs \
            /usr/bin/qemu-x86_64-static -cpu Westmere \
            -E MEMENTO_ADMIN_MASTER_KEY=compatibility-master \
            -E MEMENTO_TOKEN_WORKSPACE=compatibility-workspace \
            -E MEMENTO_TOKEN_FLINT=compatibility-flint \
            -E MEMENTO_TOKEN_WORK_AGENT=compatibility-work \
            /usr/local/bin/memento-go --config /etc/memento/config.json status \
            > /tmp/westmere-status.json
          jq -e '.semantic_search.enabled and .needle_router.enabled' /tmp/westmere-status.json

  publish:
    name: Publish multi-architecture image
    needs: [validate-tag, build, compatibility-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.validate-tag.outputs.prerelease == 'false' }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=("-t" "$tag")
          done <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          sources=()
          for digest in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect published image
        id: inspect
        shell: bash
        run: |
          image="${IMAGE_NAME}:${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.inspect.outputs.digest }}
          format: spdx-json
          output-file: memento-${{ github.ref_name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memento-${{ github.ref_name }}-sbom
          path: memento-${{ github.ref_name }}.spdx.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: memento-${{ github.ref_name }}-sbom
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          args=("$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME")
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "${args[@]}" release-assets/* --notes "Container: \`${IMAGE_NAME}:${GITHUB_REF_NAME#v}\`
          Digest: \`${IMAGE_DIGEST}\`"

  cleanup:
    name: Retain five releases, runs, and images
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Cleanup old releases, tags, runs, artifacts, and GHCR versions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const keep = 5;
            const { owner, repo } = context.repo;

            // Runtime-model bundles and other asset releases are not application
            // releases. Keep their immutable download URLs out of retention.
            const releases = (await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            })).filter(release => /^v\d+\.\d+\.\d+(?:[-+].*)?$/.test(release.tag_name));
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const release of releases.slice(keep)) {
              core.info(`Deleting release and tag ${release.tag_name}`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              if (release.tag_name) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
                } catch (error) {
                  if (error.status !== 404) core.warning(`Could not delete tag ${release.tag_name}: ${error.message}`);
                }
              }
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'release.yml', per_page: 100,
            });
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const run of runs.slice(keep)) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              for (const artifact of artifacts.filter(a => !a.expired)) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                } catch (error) {
                  core.warning(`Could not delete release artifact ${artifact.id}: ${error.message}`);
                }
              }
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                core.warning(`Could not delete workflow run ${run.id}: ${error.message}`);
              }
            }

            const ownerInfo = await github.rest.users.getByUsername({ username: owner });
            const isOrg = ownerInfo.data.type === 'Organization';
            const ownerArgs = isOrg ? { org: owner } : { username: owner };
            const listVersions = isOrg
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const deleteVersion = isOrg
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;
            try {
              const versions = await github.paginate(listVersions, {
                package_type: 'container', package_name: repo.toLowerCase(),
                per_page: 100, state: 'active', ...ownerArgs,
              });
              const tagged = versions
                .filter(v => v.metadata?.container?.tags?.length)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const untagged = versions.filter(v => !v.metadata?.container?.tags?.length);
              // Digest-first multi-arch builds create untagged platform manifests that
              // remain referenced by the tagged index. Never reap fresh children; the
              // seven-day grace period also covers delayed or retried release jobs.
              const untaggedCutoff = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
              const doomed = [
                ...tagged.slice(keep),
                ...untagged.filter(v => new Date(v.created_at) < untaggedCutoff),
              ];
              for (const version of doomed) {
                try {
                  await deleteVersion({
                    package_type: 'container', package_name: repo.toLowerCase(),
                    package_version_id: version.id, ...ownerArgs,
                  });
                } catch (error) {
                  core.warning(`Could not delete GHCR version ${version.id}: ${error.message}`);
                }
              }
            } catch (error) {
              if (error.status === 404) core.info('No GHCR package exists yet.');
              else throw error;
            }
