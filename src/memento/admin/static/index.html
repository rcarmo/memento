<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memento Access</title><style>:root{color-scheme:dark;font:16px system-ui;background:#101319;color:#eef2f7}*{box-sizing:border-box}body{margin:0}header,main{max-width:980px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.35rem}button,input,select{font:inherit;border:1px solid #465064;border-radius:9px;background:#1b2230;color:inherit;padding:10px}button{cursor:pointer;background:#315fbd;border-color:#4678da}button.danger{background:#7e2930}.card{background:#171c25;border:1px solid #303949;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#aab4c4}.pill{display:inline-block;background:#253047;border-radius:99px;padding:4px 8px;margin:2px;font-size:.85rem}label{display:grid;gap:6px;margin:10px 0}input,select{width:100%}dialog{max-width:620px;width:calc(100% - 24px);background:#171c25;color:inherit;border:1px solid #465064;border-radius:14px}pre{white-space:pre-wrap;word-break:break-all;background:#0e1117;padding:12px;border-radius:9px}.hidden{display:none}.warn{color:#ffd166}nav button{background:transparent} @media(max-width:600px){header{align-items:flex-start;gap:8px;flex-direction:column}.row button{flex:1}}</style></head><body><header><div><h1>Memento Access</h1><div class="muted">Principals, roles and namespaces</div></div><button id="lock">Enter admin credential</button></header><main><section id="locked" class="card"><h2>Authenticate</h2><p>The bearer credential stays only in this tab's memory and is sent on each admin request.</p><label>Admin bearer credential<input id="token" type="password" autocomplete="off"></label><button id="login">Open access manager</button><p id="loginError" class="warn"></p></section><section id="app" class="hidden"><nav class="row"><button data-view="principals">Principals</button><button data-view="create">Create</button><button data-view="activity">Activity</button></nav><div id="content"></div></section></main><dialog id="secret"><h2>Save this credential now</h2><p>It cannot be shown again. Import it into the target instance's Piclaw keychain.</p><pre id="secretValue"></pre><pre id="configValue"></pre><div class="row"><button id="copy">Copy bundle</button><button id="closeSecret">I saved it</button></div></dialog><script src="/admin/app.js"></script></body></html>
