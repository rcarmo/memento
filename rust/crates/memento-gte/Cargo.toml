[package]
name = "memento-gte"
version = "0.1.0"
edition = "2021"
license = "MIT"

authors = ["Rui Carmo <rui.carmo@gmail.com>"]
description = "Rust GTE1 parser/tokenizer/inference for Memento"

[features]
default = []
vulkan = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "vulkan-portability"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.21", optional = true }
memmap2 = "0.9"
memento-vector = { path = "../memento-vector" }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
